# Go back to an earlier release (docs/operations/aws.md "Releases and recovery"): redeploy its images with
# its own CDK code, no rebuild. Optionally also restore Neon `main` to how it was
# while that release was the latest, which discards everything written since
# (including sign-ins). Temporary until main is fixed: the next push to main
# releases main again, so follow a rollback with `git revert` of the bad commits.
# Don't push while this runs: a new release run would cancel this one if it is
# still waiting (one pending run per concurrency group).
name: Rollback

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release to go back to (e.g. 2026.9.24.1)
        required: true
      restore_database:
        description: Also restore the database (loses everything written since)
        type: boolean
        default: false
      confirm:
        description: Type "roll back to <release>", plus " and restore the database" when restoring
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
  NEONCTL_VERSION: 4.17.4
  AWS_REGION: ${{ secrets.AWS_REGION }}
  DEPLOY_ROLE: ${{ secrets.DEPLOY_ROLE }}
  STACK: BitePlanner
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  BITE_PLANNER_GITHUB_SUBJECT: ${{ secrets.BITE_PLANNER_GITHUB_SUBJECT }}
  BITE_PLANNER_ALARM_EMAIL: ${{ secrets.BITE_PLANNER_ALARM_EMAIL }}
  NEON_AUTH_URL_DEV: ${{ secrets.NEON_AUTH_URL_DEV }}
  NEON_AUTH_URL_PROD: ${{ secrets.NEON_AUTH_URL_PROD }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    # The drain alone may take 47 minutes (below), then the restore and the deploy.
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ inputs.release }}
      RESTORE: ${{ inputs.restore_database }}
      CONFIRM: ${{ inputs.confirm }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release }} # its CDK code and deploy action
          fetch-depth: 0 # history and tags, for the contract migration check
      - if: inputs.restore_database
        run: npm install --global "neonctl@$NEONCTL_VERSION"
      - id: check
        name: Check the preconditions
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          expected="roll back to $RELEASE"
          [ "$RESTORE" = "true" ] && expected="$expected and restore the database"
          [ "$CONFIRM" = "$expected" ] || fail "Confirmation must be exactly: $expected"
          gh release download "$RELEASE" --pattern release.json --dir "$RUNNER_TEMP" \
            || fail "$RELEASE has no release.json (only releases deployed to AWS can be rolled back to)."
          api=$(jq -er .images.api "$RUNNER_TEMP/release.json") || fail "$RELEASE's release.json has no api image."
          worker=$(jq -er .images.worker "$RUNNER_TEMP/release.json") || fail "$RELEASE's release.json has no worker image."
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          latest=$(gh release view --json tagName --jq .tagName)
          if [ "$RESTORE" = "true" ]; then
            # The database as it was while $RELEASE was the latest: the snapshot
            # the next release (in publishing order) took before migrating.
            next=$(gh release list --exclude-drafts --limit 200 --json tagName,publishedAt \
              --jq "sort_by(.publishedAt) | map(.tagName) | (index(\"$RELEASE\")) as \$i | if \$i then .[\$i + 1] // empty else empty end")
            [ -n "$next" ] || fail "$RELEASE is the latest release; there is nothing to restore."
            neonctl snapshots get "pre-$next" --project-id "$NEON_PROJECT_ID" > /dev/null \
              || fail "Snapshot pre-$next not found; restore points are kept 14 days."
            echo "snapshot=pre-$next" >> "$GITHUB_OUTPUT"
          else
            # Without a restore, the database keeps the newer schema: fine unless
            # a contract migration since then dropped something $RELEASE uses, or
            # holds data $RELEASE can't handle safely (e.g. households). Only migrations
            # added since count (--no-renames: a new file is never matched to a removed one).
            added=$(git diff --name-only --no-renames --diff-filter=A "$RELEASE" "$latest" -- backend/migrations/versions)
            contract=()
            for file in $added; do
              source=$(git show "$latest:$file")
              if grep -q '# contract:' <<< "$source"; then contract+=("$file"); fi
            done
            [ ${#contract[@]} -eq 0 ] || fail "Contract migrations since $RELEASE (${contract[*]}) make today's database unsafe for it; restore the database too, or roll back less far."
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - id: pause
        if: inputs.restore_database
        name: Stop starting jobs and wait for running ones (at most 40 minutes each)
        run: |
          output() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          pipe=$(output JobsPipeOutput)
          cluster=$(output ClusterNameOutput)
          echo "pipe=$pipe" >> "$GITHUB_OUTPUT"
          aws pipes stop-pipe --name "$pipe" > /dev/null
          for _ in $(seq 60); do
            state=$(aws pipes describe-pipe --name "$pipe" --query CurrentState --output text)
            [ "$state" = STOPPED ] && break
            sleep 5
          done
          if [ "$state" != STOPPED ]; then
            echo "::error::The jobs pipe ($pipe) is $state, not STOPPED, after 5 minutes."
            exit 1
          fi
          # A worker runs at most 2430 s (docker/Dockerfile ENTRYPOINT: timeout 2400s, then
          # --kill-after=30s); 252 × 10 s = 42 minutes also covers one that was still starting.
          for _ in $(seq 252); do
            # Assigned first, so a failing check fails the step rather than reading as none.
            tasks=$(aws ecs list-tasks --cluster "$cluster" --desired-status RUNNING --query taskArns --output text)
            [ -z "$tasks" ] && exit 0
            sleep 10
          done
          echo "::error::Workers are still running after 42 minutes; the jobs pipe is stopped ($pipe)."
          exit 1
      - name: Restore the database from ${{ steps.check.outputs.snapshot }}
        if: inputs.restore_database
        env:
          SNAPSHOT: ${{ steps.check.outputs.snapshot }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          before=$(neonctl branches get main --project-id "$NEON_PROJECT_ID" -o json | jq -r .id)
          neonctl snapshots create --project-id "$NEON_PROJECT_ID" --branch main \
            --name "before-rollback-$RELEASE-$(date -u +%Y%m%dT%H%M%SZ)" \
            --expires-at "$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%SZ)"
          neonctl snapshots restore "$SNAPSHOT" --project-id "$NEON_PROJECT_ID" --target-branch main --finalize
          after=$(neonctl branches get main --project-id "$NEON_PROJECT_ID" -o json | jq -r .id)
          {
            echo "Restored Neon main from $SNAPSHOT (everything written since is gone; everyone signs in again)."
            if [ "$after" != "$before" ]; then
              # Expected: the restored branch takes over the name; the old one is kept.
              echo "main's branch id changed: the steps below set Neon Auth's sign-up webhook on it (docs/operations/aws.md \"Households and sign-up\"). Delete the pre-restore branch when no longer needed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/deploy
        with:
          release: ${{ inputs.release }}
          api-image-digest: ${{ steps.check.outputs.api }}
          worker-image-digest: ${{ steps.check.outputs.worker }}
          role: ${{ env.DEPLOY_ROLE }}
          region: ${{ env.AWS_REGION }}
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ env.NEON_PROJECT_ID }}
      # Sign-up stays invite-only whatever the release does: this from the current main.
      - uses: actions/checkout@v7
        with:
          ref: main
          path: current
          sparse-checkout: .github/actions
      - id: api
        run: |
          url=$(jq -er '.BitePlanner.ApiUrlOutput' "$RUNNER_TEMP/cdk-outputs.json")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Make sign-up invite-only
        uses: ./current/.github/actions/invite-only
        with:
          api-url: ${{ steps.api.outputs.url }}
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ env.NEON_PROJECT_ID }}
      - name: Start jobs again
        if: inputs.restore_database
        env:
          PIPE: ${{ steps.pause.outputs.pipe }}
        run: aws pipes start-pipe --name "$PIPE" > /dev/null
      - name: Next steps
        run: |
          {
            echo "Deployed $RELEASE. main still has the newer code, and the next push to main releases it again:"
            echo "\`git revert\` the bad commits (including their migrations if the database was restored) and push."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: If this failed
        if: failure() && steps.pause.outputs.pipe != ''
        env:
          PIPE: ${{ steps.pause.outputs.pipe }}
        run: echo "::error::The jobs pipe ($PIPE) is stopped. Start it (aws pipes start-pipe --name $PIPE) once the code and the database match."
