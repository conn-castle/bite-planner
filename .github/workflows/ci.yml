name: CI

# Runs on pull requests, and inside every release (release.yml) for pushes to main.
on:
  pull_request:
    # Not checked here or shipped: agent setup, docs, local dev tooling (as in release.yml).
    paths-ignore:
      - '.agent-layer/**'
      - 'docs/**'
      - 'spec/**'
      - 'scripts/**'
      - 'Makefile'
      - 'README.md'
      - '.gitignore'
  workflow_call:
  workflow_dispatch:

# A new push to a pull request cancels its previous run; releases (run_id) never share a group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bite_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bite_planner
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - uses: actions/cache@v6
        with:
          path: .agent-layer/tmp/meal-title-model
          key: meal-title-model-${{ hashFiles('backend/agent/src/bite_planner_agent/title_model.py') }}
      - run: uv run python -m bite_planner_agent.title_model ../.agent-layer/tmp/meal-title-model
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The checkout tools' tests drive a headless browser: the build uv.lock's Playwright expects.
      - run: uv run playwright install --with-deps --only-shell chromium
      - run: uv run pytest

  mobile:
    env:
      VITE_NEON_AUTH_URL: https://auth.example.test/neondb/auth
      VITE_NEON_AUTH_TRUSTED_ORIGIN: https://app.example.test
      VITE_API_URL: https://api.example.test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          package_json_file: apps/mobile/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.ci=false
      - name: Verify pnpm shared-store layout
        run: |
          target=$(readlink -e node_modules/react)
          case "$target" in "$(pnpm store path)"/links/*) echo "$target" ;; *) echo 'React is outside the pnpm shared store' >&2; exit 1 ;; esac
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - uses: actions/setup-node@v7 # the CDK library runs on Node
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # A cold mypy spends most of this job on the CDK library's types; main saves its cache.
      - uses: actions/cache/restore@v6
        with:
          path: infra/.mypy_cache
          key: mypy-infra-${{ hashFiles('infra/uv.lock') }}-${{ github.sha }}
          restore-keys: mypy-infra-${{ hashFiles('infra/uv.lock') }}-
      - run: uv run mypy
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: infra/.mypy_cache
          key: mypy-infra-${{ hashFiles('infra/uv.lock') }}-${{ github.sha }}
      - run: uv run pytest
