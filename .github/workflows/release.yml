# Every push to main is a release (unless it only touches paths-ignore): CI, the images, a Neon snapshot of `main`,
# migrations, a deploy to AWS (smoke-tested), a GitHub release recording what
# was deployed (release.json, for rollback.yml), and a TestFlight build when the
# app changed. Nothing is deployed unless the database is ready for it.
# See README "Releases".
name: Release

on:
  push:
    branches: [main]
    # Nothing CI checks or a release ships: agent setup, docs, and local dev tooling.
    paths-ignore:
      - '.agent-layer/**'
      - 'docs/**'
      - 'spec/**'
      - 'scripts/**'
      - 'Makefile'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_ios:
        description: Build and upload the iOS app even if apps/mobile is unchanged
        type: boolean
        default: false

# Releases and rollbacks (rollback.yml) run one at a time, in order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEON_PROJECT_ID: example-project
  NEONCTL_VERSION: 4.17.4
  AWS_REGION: us-east-1
  # Created by infra/ (CastleChefRepositories); trusts only this repository's main branch.
  DEPLOY_ROLE: arn:aws:iam::123456789012:role/castle-chef-github-deploy
  REGISTRY: 123456789012.dkr.ecr.us-east-1.amazonaws.com
  # Release versions are dates here: YYYY.M.D.N, the Nth release that day.
  RELEASE_TIMEZONE: America/New_York

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  changes:
    # Every other job depends on this one, so nothing releases from another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.release.outputs.release }}
      already_released: ${{ steps.release.outputs.already_released }}
      ios: ${{ steps.ios.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history and tags, to compare with the last TestFlight upload
      - id: release
        name: Release tag for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never go backwards: re-running an old run must not deploy an older
          # commit or upload an older app (rollback.yml is for going back).
          if ! latest=$(gh release view --json tagName --jq .tagName 2> "$RUNNER_TEMP/gh-error"); then
            grep -qx "release not found" "$RUNNER_TEMP/gh-error" || { cat "$RUNNER_TEMP/gh-error" >&2; exit 1; }
            latest="" # first release
          fi
          if [ -n "$latest" ] && ! git merge-base --is-ancestor "$latest" HEAD; then
            echo "::error::$GITHUB_SHA does not contain the latest release $latest. Release a newer commit instead of re-running an old run."
            exit 1
          fi
          # Release tags: YYYY.M.D.N (and r<N> before 2026-09-24).
          existing=$(git tag --points-at HEAD --list 'r[0-9]*' '20[0-9][0-9].*' | head -n 1)
          if [ -n "$existing" ]; then
            echo "release=$existing" >> "$GITHUB_OUTPUT"
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_SHA is already released as $existing"
          else
            # Only published releases count, so a failed run's number is reused.
            today=$(TZ="$RELEASE_TIMEZONE" date +%Y.%-m.%-d)
            count=$(gh release list --exclude-drafts --limit 100 --json tagName \
              --jq "[.[] | select(.tagName | startswith(\"$today.\"))] | length")
            echo "release=$today.$((count + 1))" >> "$GITHUB_OUTPUT"
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi
      - id: ios
        name: Did the app change since the last TestFlight upload?
        env:
          FORCE_IOS: ${{ inputs.force_ios || false }}
          # Only whether each is set; TestFlight is on once all are copied from SSM.
          APPLE_SECRETS: >-
            ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != ''
            && secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' && secrets.MATCH_PASSWORD != ''
            && secrets.CASTLE_CHEF_APP_CLIENT_ID != '' && secrets.CASTLE_CHEF_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$APPLE_SECRETS" != "true" ]; then
            echo "::warning::iOS build skipped: TestFlight secrets are not all set (README \"TestFlight\")."
            echo "ios=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list 'ios-*' --sort=-creatordate | head -n 1)
          if [ "$FORCE_IOS" = "true" ]; then
            reason="forced"; ios=true
          elif [ -z "$last" ]; then
            reason="no previous upload"; ios=true
          elif ! git diff --quiet "$last" HEAD -- apps/mobile; then
            reason="apps/mobile changed since $last"; ios=true
          else
            reason="apps/mobile unchanged since $last"; ios=false
          fi
          echo "iOS build: $ios ($reason)"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  images:
    # Built alongside CI; nothing uses them until the deploy.
    needs: changes
    if: needs.changes.outputs.already_released == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      api: ${{ steps.digests.outputs.api }}
      worker: ${{ steps.digests.outputs.worker }}
    env:
      # Images are tagged by commit, so a re-run (even on another day, under
      # another release version) reuses exactly this commit's images.
      TAG: commit-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - id: existing
        name: Images already pushed for this commit (a re-run; tags are immutable)
        run: |
          for image in api worker; do
            if digest=$(aws ecr describe-images --repository-name "castle-chef-$image" --image-ids "imageTag=$TAG" \
                --query 'imageDetails[0].imageDigest' --output text 2> "$RUNNER_TEMP/ecr-error"); then
              echo "castle-chef-$image:$TAG already pushed ($digest)"
              echo "$image=$digest" >> "$GITHUB_OUTPUT"
            elif ! grep -q ImageNotFoundException "$RUNNER_TEMP/ecr-error"; then
              cat "$RUNNER_TEMP/ecr-error" >&2
              exit 1
            fi
          done
      - id: api
        if: steps.existing.outputs.api == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: api
          platforms: linux/amd64
          provenance: false # a plain image manifest, which Lambda requires
          sbom: false
          build-args: CASTLE_CHEF_COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/castle-chef-api:${{ env.TAG }}
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - id: worker
        if: steps.existing.outputs.worker == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: worker
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: CASTLE_CHEF_COMMIT=${{ github.sha }}
          # zstd layers: Fargate starts them faster than gzip.
          outputs: type=image,name=${{ env.REGISTRY }}/castle-chef-worker:${{ env.TAG }},push=true,compression=zstd,force-compression=true,oci-mediatypes=true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - id: digests
        env:
          API: ${{ steps.existing.outputs.api || steps.api.outputs.digest }}
          WORKER: ${{ steps.existing.outputs.worker || steps.worker.outputs.digest }}
        run: |
          for digest in "$API" "$WORKER"; do
            [[ "$digest" == sha256:* ]] || { echo "::error::Missing image digest ('$digest')"; exit 1; }
          done
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "worker=$WORKER" >> "$GITHUB_OUTPUT"

  migrate:
    needs: [ci, changes, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      from: ${{ steps.before.outputs.revision }}
      to: ${{ steps.after.outputs.revision }}
    defaults:
      run:
        working-directory: backend
    env:
      RELEASE: ${{ needs.changes.outputs.release }}
    # Secrets are given only to the steps that use them, never to package installs.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - run: npm install --global "neonctl@$NEONCTL_VERSION"
      - name: Restore point (Neon snapshot of main, kept 14 days)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          snapshot="pre-$RELEASE"
          if neonctl snapshots get "$snapshot" --project-id "$NEON_PROJECT_ID" > /dev/null 2>&1; then
            echo "Snapshot $snapshot already exists (re-run)"
          else
            neonctl snapshots create --project-id "$NEON_PROJECT_ID" --branch main \
              --name "$snapshot" --expires-at "$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%SZ)"
          fi
      - id: before
        env:
          # Direct (non-pooled) owner connection to Neon `main`; Alembic reads DATABASE_URL.
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          set -o pipefail
          revision=$(uv run alembic current | cut -d ' ' -f 1)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - id: after
        name: Check main is at this release's migrations and matches the models
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          current=$(uv run alembic current | cut -d ' ' -f 1)
          heads=$(uv run alembic heads | cut -d ' ' -f 1)
          if [ "$current" != "$heads" ]; then
            echo "::error::main is at migration '$current', expected '$heads'"
            exit 1
          fi
          uv run alembic check
          echo "revision=$current" >> "$GITHUB_OUTPUT"

  deploy:
    # After the migrations: expand/contract keeps the running code working in between.
    needs: [changes, images, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/deploy
        with:
          release: ${{ needs.changes.outputs.release }}
          api-image-digest: ${{ needs.images.outputs.api }}
          worker-image-digest: ${{ needs.images.outputs.worker }}
          role: ${{ env.DEPLOY_ROLE }}
          region: ${{ env.AWS_REGION }}
          neon-api-key: ${{ secrets.NEON_API_KEY }}
          neon-project-id: ${{ env.NEON_PROJECT_ID }}

  publish:
    needs: [changes, images, migrate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.changes.outputs.release }}
      FROM: ${{ needs.migrate.outputs.from }}
      TO: ${{ needs.migrate.outputs.to }}
      API_IMAGE: ${{ needs.images.outputs.api }}
      WORKER_IMAGE: ${{ needs.images.outputs.worker }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # release.json is what rollback.yml redeploys; created with GITHUB_TOKEN.
      - run: |
          if gh release view "$RELEASE" > /dev/null 2>&1; then
            echo "Release $RELEASE already exists (re-run)"
            exit 0
          fi
          jq -n --arg release "$RELEASE" --arg commit "$GITHUB_SHA" --arg api "$API_IMAGE" \
            --arg worker "$WORKER_IMAGE" --arg migration "$TO" \
            '{release: $release, commit: $commit, images: {api: $api, worker: $worker}, migration: $migration}' \
            > "$RUNNER_TEMP/release.json"
          previous=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          migrations="unchanged ($TO)"
          [ "$FROM" != "$TO" ] && migrations="${FROM:-none} → $TO"
          changes="first release"
          [ -n "$previous" ] && changes="https://github.com/$GH_REPO/compare/$previous...$RELEASE"
          gh release create "$RELEASE" "$RUNNER_TEMP/release.json" --target "$GITHUB_SHA" --title "$RELEASE" --latest --notes "$(cat <<NOTES
          Commit: $GITHUB_SHA
          Deployed: api $API_IMAGE, worker $WORKER_IMAGE
          Migrations on Neon main: $migrations
          Restore point: Neon snapshot pre-$RELEASE (kept 14 days)
          Changes: $changes
          NOTES
          )"

  ios:
    needs: [changes, publish]
    # Also runs when publish was skipped because this commit is already released (force_ios).
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.ios == 'true' }}
    runs-on: macos-latest
    # macOS minutes count 10x; a stuck build would otherwise run for the 6-hour default.
    timeout-minutes: 30
    outputs:
      version: ${{ steps.upload.outputs.version }}
      build_number: ${{ steps.upload.outputs.build_number }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          package_json_file: apps/mobile/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8  # v1.327.0
        with:
          working-directory: apps/mobile
          bundler-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          CASTLE_CHEF_RELEASE: ${{ needs.changes.outputs.release }}
      - run: pnpm exec cap sync ios
      # One-hour, read-only token for the match certificates repo (Castle Chef Bot app).
      - id: certs
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CASTLE_CHEF_APP_CLIENT_ID }}
          private-key: ${{ secrets.CASTLE_CHEF_APP_PRIVATE_KEY }}
          owner: nicholasjconn
          repositories: conn-castle-apple-certs
          permission-contents: read
      - id: upload
        name: Build and upload to TestFlight
        run: |
          MATCH_GIT_BASIC_AUTHORIZATION=$(printf 'x-access-token:%s' "$CERTS_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$MATCH_GIT_BASIC_AUTHORIZATION"
          export MATCH_GIT_BASIC_AUTHORIZATION
          bundle exec fastlane beta
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          CERTS_TOKEN: ${{ steps.certs.outputs.token }}
          # The app's version and build: 2026.9.24.2 is version 2026.9.24, build 2.
          CASTLE_CHEF_RELEASE: ${{ needs.changes.outputs.release }}

  # Waiting for Apple's processing on Linux costs ~1/10 of waiting on macOS.
  testflight-processed:
    needs: [changes, ios]
    if: ${{ !cancelled() && !failure() && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    env:
      RELEASE: ${{ needs.changes.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8  # v1.327.0
        with:
          working-directory: apps/mobile
          bundler-cache: true
      - name: Wait for App Store Connect processing
        run: >-
          bundle exec fastlane processed
          version:${{ needs.ios.outputs.version }} build_number:${{ needs.ios.outputs.build_number }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      # Marks the upload so later releases only build when apps/mobile changes.
      # Without it (upload or processing failed), the next release builds again.
      - name: Tag the uploaded commit
        run: |
          tag="ios-$RELEASE"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
