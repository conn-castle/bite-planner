# Compiles the iOS app for pull requests that affect the native build.
name: iOS

on:
  pull_request:
    paths:
      - 'apps/mobile/ios/**'
      - 'apps/mobile/package.json'
      - 'apps/mobile/pnpm-lock.yaml'
      - 'apps/mobile/capacitor.config.ts'
      - '.github/workflows/ios.yml'

# A new push to the pull request cancels its previous build (macOS minutes count 10x).
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    env:
      VITE_NEON_AUTH_URL: https://auth.example.test/neondb/auth
      VITE_NEON_AUTH_TRUSTED_ORIGIN: https://app.example.test
      VITE_API_URL: https://api.example.test
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
        with:
          package_json_file: apps/mobile/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap sync ios
      - run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
