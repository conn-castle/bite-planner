# Deploys the CDK stacks (infra/, stage prod) with the given images, then
# smoke-tests the API. Used by release.yml and rollback.yml (which runs it from
# the release it goes back to, with that release's CDK code).
name: Deploy
description: cdk deploy the prod stacks with the given image digests, then smoke-test the API

inputs:
  release:
    description: The release version being deployed (YYYY.M.D.N), which the services log
    required: true
  api-image-digest:
    description: sha256:… of the api image in ECR
    required: true
  worker-image-digest:
    description: sha256:… of the worker image in ECR
    required: true
  role:
    description: IAM role to deploy with (GitHub OIDC)
    required: true
  region:
    description: AWS region
    required: true
  neon-api-key:
    description: Neon API key (the project's), to make sign-up on main invite-only
    required: true
  neon-project-id:
    description: The Neon project
    required: true

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
      with:
        role-to-assume: ${{ inputs.role }}
        aws-region: ${{ inputs.region }}
        mask-aws-account-id: true
    - name: cdk deploy
      shell: bash
      working-directory: infra
      env:
        CDK_VERSION: 2.1143.0
        RELEASE: ${{ inputs.release }}
        API_DIGEST: ${{ inputs.api-image-digest }}
        WORKER_DIGEST: ${{ inputs.worker-image-digest }}
      run: |
        uv sync --locked
        npx --yes "aws-cdk@$CDK_VERSION" deploy --all --require-approval never --progress events \
          -c stage=prod -c "release=$RELEASE" -c "apiImageDigest=$API_DIGEST" -c "workerImageDigest=$WORKER_DIGEST" \
          --outputs-file "$RUNNER_TEMP/cdk-outputs.json"
    - name: Smoke test
      shell: bash
      run: |
        url=$(jq -er '.CastleChef.ApiUrlOutput' "$RUNNER_TEMP/cdk-outputs.json")
        # A cold start loads secrets from SSM and connects nothing else; retry briefly.
        curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 "${url}health"
        echo
        status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "${url}v1/me")
        if [ "$status" != 401 ]; then
          echo "::error::GET /v1/me without a token returned $status, expected 401"
          exit 1
        fi
        echo "Smoke test passed: $url" >> "$GITHUB_STEP_SUMMARY"
    - id: api
      shell: bash
      run: |
        url=$(jq -er '.CastleChef.ApiUrlOutput' "$RUNNER_TEMP/cdk-outputs.json")
        echo "url=$url" >> "$GITHUB_OUTPUT"
    - name: Make sign-up invite-only
      uses: ./.github/actions/invite-only
      with:
        api-url: ${{ steps.api.outputs.url }}
        neon-api-key: ${{ inputs.neon-api-key }}
        neon-project-id: ${{ inputs.neon-project-id }}
    - name: Rebuild the reminder schedules
      shell: bash
      run: |
        # Every member's schedule from the database (reminders.py `sync`): creates the
        # missing, fixes the stale, deletes removed members'.
        function=$(jq -er '.CastleChef.RemindersFunctionOutput' "$RUNNER_TEMP/cdk-outputs.json")
        result="$RUNNER_TEMP/reminders-sync.json"
        error=$(aws lambda invoke --function-name "$function" --cli-binary-format raw-in-base64-out \
          --payload '{"version": 1, "sync": true}' --query FunctionError --output text "$result")
        cat "$result"; echo
        if [ "$error" != None ] || ! jq -e '.failed == 0 and (.upserted | type == "number")' "$result" > /dev/null; then
          echo "::error::Rebuilding the reminder schedules failed (see above and the Reminders logs)"
          exit 1
        fi
        echo "Reminder schedules: $(cat "$result")" >> "$GITHUB_STEP_SUMMARY"
