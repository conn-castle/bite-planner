[project]
name = "castle-chef"
version = "0.1.0"
description = "Castle Chef backend: database models, agent CLI, and job worker."
authors = [
    { name = "Nick Conn", email = "nicholasjconn@users.noreply.github.com" }
]
requires-python = ">=3.14"
# What the worker needs; the API also needs the `api` group.
dependencies = [
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.46",
    "typer>=0.27.2",
]

[project.scripts]
castle-chef = "castle_chef.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# The API (and failure handler). A group rather than a dependency so the worker
# image, which starts once per job, leaves it out (docker/Dockerfile).
api = [
    "boto3>=1.43.101",
    "fastapi>=0.141.1",
    "pyjwt[crypto]>=2.15.0",
    "uvicorn>=0.53.0",
]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
default-groups = ["api", "dev"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
