[project]
name = "bite-planner"
version = "0.1.0"
description = "Bite Planner backend: database models, CLI, and job worker."
authors = [
    { name = "Nick Conn", email = "nicholasjconn@users.noreply.github.com" }
]
requires-python = ">=3.14"
# What the worker needs; the API also needs the `api` group.
dependencies = [
    "alembic>=1.20.0",
    "bite-planner-agent",
    "httpx2[http2]>=2.13.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.0",
    "sqlmodel>=0.0.46",
    "typer>=0.27.2",
]

[project.scripts]
bite-planner = "bite_planner.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# The API (and failure handler). A group rather than a dependency so the worker
# image, which starts once per job, leaves it out (docker/Dockerfile).
api = [
    "boto3>=1.43.101",
    "fastapi>=0.141.1",
    "tzdata>=2026.4",
    "uvicorn>=0.53.0",
]
# Worker-only inference and AWS calls (the Instacart session in SSM).
worker = [
    "bite-planner-agent[meal-similarity]",
    "boto3>=1.43.101",
]
dev = [
    "python-dotenv>=1.2.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3",
    "ruff>=0.16.8",
]

[tool.uv]
default-groups = ["api", "worker", "dev"]

[tool.uv.workspace]
# The agent's tools: installed on their own for the agent (docker/Dockerfile).
members = ["agent"]

[tool.uv.sources]
bite-planner-agent = { workspace = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Instacart writes delivery windows with en dashes ("2pm–4pm"), as does the app.
allowed-confusables = ["–"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# In parallel, a database per worker (tests/conftest.py); `-n 0` runs them one by one.
addopts = "-n auto --dist loadgroup"

[tool.mypy]
files = ["src", "agent/src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

# These SDK/runtime bindings ship no type information.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "onnxruntime"]
ignore_missing_imports = true

# The tests read the API's answers as JSON (`Response.json()` is `Any`), not as its models.
[[tool.mypy.overrides]]
module = ["tests.*"]
warn_return_any = false
