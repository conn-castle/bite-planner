[project]
name = "bite-planner-agent"
version = "0.1.0"
description = "The tools a Bite Planner job's agent uses, and their checks: all it can reach."
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.2.0",
    "openai>=3.28.0",
    # The checkout tools' browser (docker/Dockerfile adds the browser itself).
    "playwright>=1.63.0",
    "pydantic>=2.13.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
