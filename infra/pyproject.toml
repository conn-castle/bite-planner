[project]
name = "castle-chef-infra"
version = "0.1.0"
description = "Castle Chef AWS infrastructure (CDK)."
requires-python = ">=3.14"
dependencies = [
    "aws-cdk-lib==2.270.0",
    "constructs>=10.8.1,<11",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
