[approvals]
mode = "yolo"

[agents.antigravity]
enabled = true
model = "gemini-4-neon-high"

[agents.claude]
enabled = true
model = "opus"
reasoning_effort = "high"
local_config_dir = true
disable_question_tool = true
statusline = true

[agents.claude.agent_specific]
autoMemoryEnabled = false
cleanupPeriodDays = 3650
outputStyle = "Concise"

[agents.claude.agent_specific.env]
CLAUDE_CODE_AUTO_CONNECT_IDE = "false"
ENABLE_CLAUDEAI_MCP_SERVERS = "false"

[agents.claude.agent_specific.enabledPlugins]
"cowork-plugin-management@synced" = false
"design@synced" = false
"engineering@synced" = false
"enterprise-search@synced" = false
"finance@synced" = false
"legal@synced" = false
"marketing@synced" = false
"operations@synced" = false
"product-management@synced" = false
"productivity@synced" = false
"sales@synced" = false

[agents.claude_vscode]
enabled = false

[agents.codex]
enabled = true
model = "gpt-6.2-sol"
reasoning_effort = "high"
local_config_dir = true
statusline = true

[agents.codex.agent_specific]
model_fallback = false

[agents.codex.agent_specific.features]
computer_use = false
in_app_browser = false
browser_use = false
plugins = false
apps = false
prevent_idle_sleep = true

[agents.codex.agent_specific.tui]
whimsy = false

[agents.vscode]
enabled = false

[agents.copilot_cli]
enabled = false

[agents.grok]
enabled = true
reasoning_effort = "xhigh"
disable_memory = true
model = "grok-4.7"

[agents.muse]
enabled = true
model = "muse-wonder-1.0"
reasoning_effort = "high"

[mcp]

[warnings]
version_update_on_sync = true
noise_mode = "default"
instruction_token_threshold = 10000
mcp_server_threshold = 15
mcp_tools_total_threshold = 60
mcp_server_tools_threshold = 25
mcp_schema_tokens_total_threshold = 30000
mcp_schema_tokens_server_threshold = 20000

[dispatch]
max_depth = 3
session_retention_days = 30
reservation_expiry_days = 7
mcp_wait_timeout_minutes = 30
mcp_tool_timeout_minutes = 40

[notifications]
chime = true

[[instructions.imports]]
repository = "https://github.com/nicholasjconn/skills.git"
selectors = ["instructions/rules.md"]
order = 0

[[instructions.local]]
selectors = ["conventions.md"]
order = 40

[[skills.imports]]
repository = "https://github.com/nicholasjconn/skills.git"
selectors = [
  "skills/tools/tavily-web",
  "skills/tools/playwright",
  "skills/tools/find-docs",
  "skills/development/implement",
  "skills/development/ship-pr",
  "skills/development/auto-skill-loop",
  "skills/development/audit-documentation",
  "skills/development/audit-memory",
  "skills/development/audit-tests",
  "skills/development/interface-audit",
]
