# The worker's Agent Layer project: only what `al grok` needs to run the job's
# agent (docker/Dockerfile copies it). No instructions, skills, or MCP servers.

[approvals]
# Grok's headless mode auto-approves every tool call; the container limits the agent.
mode = "yolo"

[agents.grok]
enabled = true
model = "grok-4.7"
reasoning_effort = "xhigh"
disable_memory = true

# Agent Layer requires every client's switch; the worker uses only Grok.
[agents.antigravity]
enabled = false

[agents.claude]
enabled = false

[agents.claude_vscode]
enabled = false

[agents.codex]
enabled = false

[agents.vscode]
enabled = false

[agents.copilot_cli]
enabled = false

[agents.muse]
enabled = false
