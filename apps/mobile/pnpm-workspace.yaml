enableGlobalVirtualStore: true
allowBuilds:
  core-js: false
overrides:
  # Neon Auth pins an affected Better Auth release. Keep its clients/plugins aligned
  # until Neon publishes the security update: GHSA-965c-763c-88jm.
  better-auth@<1.7.23: 1.7.23
  '@better-auth/api-key@<1.7.23': 1.7.23
  '@better-auth/core@<1.7.23': 1.7.23
  '@better-auth/passkey@<1.7.23': 1.7.23
  better-call@>=1 <1.4.5: 1.4.5
  '@better-fetch/fetch@<1.3.3': 1.3.3
  zod@>=4 <4.6.6: ^4.6.6
  # React Email pins an older renderer; its compatible update removes unpatched
  # deepmerge via html-to-text 10 (GHSA-gcqx-w48m-w2h4).
  '@react-email/render@>=2 <2.3.1': ^2.3.1
  # CLI/code-generation parents still request the affected glob/minimatch majors.
  glob@>=9 <14.0.2: ^14.0.2
  minimatch@>=7 <11.0.1: ^11.0.8
packageExtensions:
  '@ionic/react@9.0.5':
    peerDependencies: { '@types/react': '^18 || ^19' }
  '@ionic/react-router@9.0.5':
    peerDependencies: { '@types/react': '^18 || ^19' }
  '@stencil/react-output-target@1.6.2':
    peerDependencies: { '@types/react': '^18 || ^19' }
